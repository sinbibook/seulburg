<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>양평 솔베르크 독채풀빌라</title>
    <meta name="description" content="양평 자연 속 프라이빗 풀빌라, 감성 휴식을 완성하는 양평 솔베르크 펜션 입니다.">
    <meta name="keywords" content="양평펜션, 경기도펜션, 양평독채펜션, 양평풀빌라, 양평풀빌라펜션, 양평독채풀빌라, 양평스파펜션, 개별바베큐">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/slider.css">
    <link rel="stylesheet" href="styles/nearby-attractions.css">

  <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="양평 솔베르크 독채풀빌라" />
  <meta property="og:description" content="숲을 바라보며 스파와 프라이빗 풀을 즐길 수 있는 솔베르크입니다. 바베큐팩토리도 같이 이용 가능합니다." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/24/qdjNCTpvr3S1.jpg" />
  <meta property="og:url" content="https://seulburg.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="양평 솔베르크 독채풀빌라" />
  <meta name="twitter:description" content="숲을 바라보며 스파와 프라이빗 풀을 즐길 수 있는 솔베르크입니다. 바베큐팩토리도 같이 이용 가능합니다." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/24/qdjNCTpvr3S1.jpg" />
</head>
<body>
    <main class="main-content">
        <!-- CUSTOM FIELD : 메인 소개 섹션 -->
        <section class="hero-section hero-center-bottom">
            <div class="hero-slider" data-hero-slider>
                <!-- 근처 관광지 이미지 동적 매핑 -->
            </div>
            <!-- 페이지명 하드코딩 -->
            <div class="hero-property-title">NEARBY ATTRACTIONS</div>
        </section>

        <div class="nearby-attractions-section">
            <div class="nearby-intro">
                <!-- homepage.customFields.pages.nearbyAttractions.sections[0].hero.title 매핑 -->
                <h2 class="nearby-title animate-element" data-nearby-intro-title></h2>
                <!-- homepage.customFields.pages.nearbyAttractions.sections[0].hero.description 매핑 -->
                <p class="nearby-description animate-element" data-nearby-intro-description></p>
            </div>

            <!-- CUSTOM FIELD : 명소 블록 리스트 (동적 생성) -->
            <!-- homepage.customFields.pages.nearbyAttractions.sections[0].about[] 매핑 -->
            <section class="attractions-list" data-attractions-blocks>
                <!-- 동적으로 attraction-block이 생성됩니다 -->
            </section>
        </div>
    </main>

    <!-- property.images[0].exterior 첫번째 이미지 배경 매핑 -->
    <section class="full-banner animate-element" data-nearby-banner>
        <!-- property.nameEn 매핑 (uppercase) -->
        <h2 class="full-banner-title" data-property-name-en></h2>
        <div class="full-banner-circle" data-nearby-banner-bg></div>
    </section>

    <!-- property.nameEn 매핑 (uppercase, 5개 span 반복) -->
    <div class="marquee-section">
        <div class="marquee-container">
            <div class="marquee-text" data-marquee-property-name>
                <!-- 동적으로 span이 생성됩니다 -->
            </div>
        </div>
    </div>


    <!-- Image Helpers -->
    <script src="js/image-helpers.js"></script>

    <!-- Base Data Mapper -->
    <script src="js/data-mapper/core/base-mapper.js"></script>

    <!-- Nearby Attractions Page Mapper -->
    <script src="js/data-mapper/pages/nearby-attractions-mapper.js"></script>

    <!-- Preview Handler for Admin Integration -->
    <script src="js/preview-handler.js"></script>

    <!-- Header Footer Mapper -->
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>

    <!-- Header and Footer Loader -->
    <script src="js/header-footer-loader.js"></script>

    <!-- Page-specific script -->
    <script src="js/pages/nearby-attractions.js"></script>

    <!-- Scroll Animations -->
    <script src="js/scroll-animations.js"></script>

</body>
</html>
